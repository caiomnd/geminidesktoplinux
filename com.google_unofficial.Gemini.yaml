app-id: com.google_unofficial.Gemini
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: gemini-desktop

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.freedesktop.secrets

modules:
  - name: gemini-desktop
    buildsystem: simple
    build-commands:
      - install -Dm755 app.py /app/bin/gemini-desktop
      - install -Dm755 generate_icon.py /app/bin/generate_icon.py
      - install -Dm644 com.google_unofficial.Gemini.desktop /app/share/applications/com.google_unofficial.Gemini.desktop
      - install -Dm644 com.google_unofficial.Gemini.metainfo.xml /app/share/metainfo/com.google_unofficial.Gemini.metainfo.xml
      - install -Dm644 icons/128x128/com.google_unofficial.Gemini.png /app/share/icons/hicolor/128x128/apps/com.google_unofficial.Gemini.png
      - install -Dm644 icons/scalable/com.google_unofficial.Gemini.svg /app/share/icons/hicolor/scalable/apps/com.google_unofficial.Gemini.svg
    sources:
      - type: dir
        path: .
